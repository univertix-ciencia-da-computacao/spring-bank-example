spring.application.name=vorcaro-api

# Configuração do banco de dados em memória H2
spring.datasource.url=jdbc:h2:mem:bndesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=xandao
spring.datasource.password=

# Habilitar o console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# DDL automatico do Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
